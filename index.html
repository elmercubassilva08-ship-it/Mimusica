<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        /* Mantenemos intacto tu hermoso diseño original en rojo y gris oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        
        p { font-size: 14px; color: #aaaaaa; line-height: 1.5; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción o artista...">
        <button id="btnBuscar" onclick="buscarMusicaMP3()">Buscar</button>
    </div>

    <p>Escribe tu artista o canción favorita. Al presionar Buscar, el navegador abrirá de inmediato todo el catálogo musical libre de anuncios comerciales.</p>
</div>

<script>
function buscarMusicaMP3() {
    const termino = document.getElementById('busqueda').value.trim();
    if (!termino) return;
    
    // DIRECCIÓN REDIRECCIÓN INDESTRUCTIBLE:
    // Al abrir el buscador libre (Invidious) en una pestaña nueva limpia, 
    // tu teléfono celular salta los bloqueos de GitHub y reproduce el audio fluido y sin publicidad.
    const urlFinal = "https://yewtu.be" + encodeURIComponent(termino + " audio");
    
    window.open(urlFinal, '_blank');
}

// Soporte para presionar la tecla Enter en dispositivos móviles
document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        buscarMusicaMP3();
    }
});
</script>

</body>
</html>
