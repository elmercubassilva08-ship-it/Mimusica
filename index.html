<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #161616;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            color: #ff2d55;
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #ff2d55;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-container {
            min-height: 50px;
            margin-bottom: 10px;
        }

        .status-text {
            color: #8e8e93;
            font-size: 14px;
            margin: 5px 0;
        }

        .error-text {
            color: #ff453a;
            font-size: 14px;
            font-weight: 500;
            display: none;
            word-break: break-all;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            background-color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Mi Música</h1>

        <div class="search-box">
            <input type="text" id="inputBusqueda" placeholder="Andrés Calamaro, Mana, Mar de copas...">
            <button id="botonBuscar">Buscar</button>
        </div>

        <div class="status-container">
            <p id="textoEstado" class="status-text"></p>
            <p id="textoError" class="error-text"></p>
        </div>

        <audio id="reproductorAudio" controls></audio>
    </div>

    <script>
        const inputBusqueda = document.getElementById('inputBusqueda');
        const botonBuscar = document.getElementById('botonBuscar');
        const reproductorAudio = document.getElementById('reproductorAudio');
        const textoEstado = document.getElementById('textoEstado');
        const textoError = document.getElementById('textoError');

        botonBuscar.addEventListener('click', buscarEnLibreriaExterna);
        inputBusqueda.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarEnLibreriaExterna();
        });

        function buscarEnLibreriaExterna() {
            const termino = inputBusqueda.value.trim();
            if (termino === "") return;

            // Resetear mensajes e iniciar carga interna
            textoError.style.display = 'none';
            textoError.textContent = '';
            textoEstado.textContent = "Conectando con la librería en línea...";

            // 1. Creamos la consulta para la librería millonaria de Deezer
            const urlDeezer = 'https://deezer.com' + encodeURIComponent(termino) + '&limit=5';
            
            // 2. La envolvemos en el proxy AllOrigins para romper el bloqueo CORS de raíz
            const urlFinal = 'https://allorigins.win' + encodeURIComponent(urlDeezer);

            fetch(urlFinal)
                .then(response => {
                    if (!response.ok) throw new Error("Error al procesar la solicitud en el servidor.");
                    return response.json();
                })
                .then(data => {
                    // El proxy entrega la respuesta real como texto dentro de la propiedad 'contents'
                    const respuestaReal = JSON.parse(data.contents);

                    if (!respuestaReal.data || respuestaReal.data.length === 0) {
                        throw new Error("No se encontraron canciones para esta búsqueda.");
                    }

                    // Tomamos el primer resultado que coincide con el artista o género buscado
                    const pista = respuestaReal.data[0];
                    
                    // Mostramos el nombre de la canción en la interfaz de la app
                    textoEstado.textContent = "Reproduciendo: " + pista.title + " - " + pista.artist.name;

                    // IMPORTANTE: Forzamos HTTPS en el archivo mp3 para que GitHub Pages no lo bloquee por seguridad
                    const urlMp3Segura = pista.preview.replace(/^http:\/\//i, 'https://');

                    // Inyectamos el archivo de sonido directamente en su barra blanca
                    reproductorAudio.src = urlMp3Segura;
                    reproductorAudio.load();
                    
                    // Ejecutamos la reproducción
                    reproductorAudio.play().catch(err => {
                        textoEstado.textContent = "Canción cargada. Dale al botón de Play blanco.";
                        console.log("El navegador del móvil requiere una pulsación física para sonar.");
                    });
                })
                .catch(error => {
                    console.error("Falla en la app:", error);
                    textoEstado.textContent = "";
                    mostrarError(error.message || "Error de conexión. Inténtalo de nuevo.");
                });
        }

        function mostrarError(mensaje) {
            textoError.textContent = mensaje;
            textoError.style.display = 'block';
        }
    </script>
</body>
</html>
