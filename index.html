<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        
        #resultados {
            text-align: left;
            margin-bottom: 25px;
            max-height: 250px;
            overflow-y: auto;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #2f2f2f;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
        }
        .track-item:hover { background: #3f3f3f; }
        .track-img { width: 45px; height: 45px; border-radius: 6px; margin-right: 12px; object-fit: cover; }
        .track-info { flex: 1; overflow: hidden; }
        .track-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #player-wrapper {
            margin-top: 15px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }
        iframe {
            width: 100%;
            height: 120px;
            border: none;
        }
        .mensaje { text-align: center; color: #aaaaaa; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción...">
        <button id="btnBuscar" onclick="buscarMusica()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    <div id="resultados"></div>
    
    <div id="player-wrapper">
        <iframe id="reproductor" src=""></iframe>
    </div>
</div>

<script>
async function buscarMusica() {
    const termino = document.getElementById('busqueda').value.trim();
    const contenedor = document.getElementById('resultados');
    if(!termino) return;
    
    contenedor.innerHTML = "<p class='mensaje'>Buscando en la base de datos...</p>";

    try {
        // Consultamos un motor de búsqueda público y abierto compatible con GitHub Pages
        const urlApi = "https://v06.me" + encodeURIComponent(termino);
        const respuesta = await fetch(urlApi);
        const canciones = await respuesta.json();
        
        contenedor.innerHTML = "";
        
        if (!canciones || canciones.length === 0) {
            contenedor.innerHTML = "<p class='mensaje'>No se encontraron resultados.</p>";
            return;
        }
        
        // Mostrar la lista de canciones en tu contenedor gris
        canciones.slice(0, 6).forEach(track => {
            const item = document.createElement('div');
            item.className = 'track-item';
            
            const portada = track.artwork_url ? track.artwork_url : 'https://picsum.photos';
            
            item.innerHTML = `
                <img class="track-img" src="${portada}" alt="Portada">
                <div class="track-info">
                    <div class="track-title">${track.title}</div>
                </div>
            `;
            
            // Al hacer clic, se abre el reproductor oficial abajo de forma inmediata
            item.onclick = () => {
                const wrapper = document.getElementById('player-wrapper');
                const iframe = document.getElementById('reproductor');
                const nowPlaying = document.getElementById('now-playing');
                
                nowPlaying.innerText = "Reproduciendo: " + track.title;
                
                // Cargamos el widget oficial sin anuncios visuales intermedios
                iframe.src = "https://soundcloud.com" + encodeURIComponent(track.uri) + "&color=%23ff0000&auto_play=true&hide_related=true&show_comments=false&show_user=false";
                wrapper.style.display = "block";
            };
            
            contenedor.appendChild(item);
        });
        
    } catch (error) {
        contenedor.innerHTML = "<p class='mensaje'>Error al conectar. Inténtalo de nuevo.</p>";
        console.error(error);
    }
}

// Soporte para presionar Enter en celulares
document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        buscarMusica();
    }
});
</script>

</body>
</html>
