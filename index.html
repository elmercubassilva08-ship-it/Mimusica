<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        #resultados {
            text-align: left;
            margin-bottom: 25px;
            max-height: 280px;
            overflow-y: auto;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #2f2f2f;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .track-item:hover { background: #3f3f3f; }
        .track-img { width: 50px; height: 50px; border-radius: 6px; margin-right: 12px; object-fit: cover; }
        .track-info { flex: 1; overflow: hidden; }
        .track-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-author { font-size: 12px; color: #aaaaaa; }
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        #player-container { width: 100%; margin-top: 15px; display: none; }
        iframe { border-radius: 12px; width: 100%; height: 80px; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción o artista...">
        <button onclick="buscarMusica()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    <div id="resultados"></div>

    <!-- Contenedor del reproductor oficial invisible/reducido -->
    <div id="player-container">
        <div id="reproductor-youtube"></div>
    </div>
</div>

<script>
// Cargar la API de YouTube de forma asíncrona
var tag = document.createElement('script');
tag.src = "https://youtube.com";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

var player;
function onYouTubeIframeAPIReady() {
    player = new YT.Player('reproductor-youtube', {
        height: '60',
        width: '100%',
        videoId: '',
        playerVars: {
            'slideshow': 0,
            'playlist': 0,
            'controls': 1,
            'rel': 0,
            'showinfo': 0,
            'modestbranding': 1
        }
    });
}

async function buscarMusica() {
    const termino = document.getElementById('busqueda').value;
    const contenedor = document.getElementById('resultados');
    if(!termino) return;
    
    contenedor.innerHTML = "<p style='color:#aaaaaa; text-align:center;'>Buscando música...</p>";

    try {
        // Motor de búsqueda pública alternativo y estable sin API Key obligatoria
        const url = `https://images${encodeURIComponent(termino)}&type=video`;
        const respuesta = await fetch(url);
        
        // Si el motor libre falla, usamos un sistema de redirección directa seguro
        if(!respuesta.ok) {
            window.open(`https://youtube.com{encodeURIComponent(termino)}`, '_blank');
            contenedor.innerHTML = "<p style='color:#aaaaaa; text-align:center;'>Abriendo buscador integrado estable...</p>";
            return;
        }

        const datos = await respuesta.json();
        contenedor.innerHTML = ""; 
        
        if (!datos || datos.length === 0) {
            contenedor.innerHTML = "<p style='color:#aaaaaa; text-align:center;'>No se encontraron resultados.</p>";
            return;
        }
        
        datos.slice(0, 8).forEach(video => {
            const item = document.createElement('div');
            item.className = 'track-item';
            
            item.innerHTML = `
                <img class="track-img" src="https://youtube.com{video.id}/hqdefault.jpg" alt="Portada">
                <div class="track-info">
                    <div class="track-title">${video.title}</div>
                    <div class="track-author">Video musical</div>
                </div>
            `;
            
            item.onclick = () => {
                document.getElementById('now-playing').innerText = `Reproduciendo: ${video.title}`;
                document.getElementById('player-container').style.display = 'block';
                
                // Carga la canción directamente en el reproductor oficial
                if (player && player.loadVideoById) {
                    player.loadVideoById(video.id);
                } else {
                    // Alternativa directa si la API tarda en inicializar
                    document.getElementById('player-container').innerHTML = `<iframe src="https://youtube.com{video.id}?autoplay=1&modestbranding=1" allow="autoplay"></iframe>`;
                }
            };
            
            contenedor.appendChild(item);
        });
    } catch (error) {
        // Plan de respaldo automático: Si las restricciones de red bloquean el script, busca mediante la plataforma oficial directamente
        contenedor.innerHTML = "<p style='color:#aaaaaa; text-align:center;'>Conectando de forma directa y estable...</p>";
        setTimeout(() => {
            // Reemplaza el visor por un buscador embebido directo para saltar bloqueos de GitHub
            contenedor.innerHTML = `<iframe src="https://youtube.com{encodeURIComponent(termino)}&modestbranding=1" style="height:300px;"></iframe>`;
        }, 500);
    }
}
</script>

</body>
</html>
