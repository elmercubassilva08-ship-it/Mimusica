<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff5500; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff5500;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #e04b00; }
        p { color: #aaaaaa; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción...">
        <button onclick="buscarMusica()">Buscar</button>
    </div>

    <p>Escribe tu artista favorito. Al presionar buscar, se abrirá tu música de forma directa, legal y sin anuncios molestos.</p>
</div>

<script>
function buscarMusica() {
    const termino = document.getElementById('busqueda').value;
    if(!termino) return;
    
    // Abre la búsqueda de forma externa saltando cualquier bloqueo de servidor
    const urlLimpia = "https://soundcloud.com" + encodeURIComponent(termino);
    window.open(urlLimpia, '_blank');
}
</script>

</body>
</html>
