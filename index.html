<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música Sin Anuncios</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #1DB954; font-size: 24px; }
        .search-box { display: flex; margin-bottom: 20px; }
        input {
            flex: 1; padding: 12px; border: none;
            border-radius: 20px 0 0 20px; background-color: #282828;
            color: white; font-size: 16px; outline: none;
        }
        button {
            padding: 12px 20px; border: none;
            border-radius: 0 20px 20px 0; background-color: #1DB954;
            color: white; font-weight: bold; cursor: pointer;
        }
        #results { margin-bottom: 100px; }
        .song-item {
            display: flex; align-items: center; padding: 10px;
            margin-bottom: 10px; background-color: #181818;
            border-radius: 8px; cursor: pointer;
        }
        .song-item img {
            width: 50px; height: 50px; object-fit: cover;
            border-radius: 4px; margin-right: 15px;
        }
        .song-info { flex: 1; }
        .song-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .song-author { color: #b3b3b3; font-size: 12px; }
        
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: #282828; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }
        #current-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; text-align: center; }
        .controls { display: flex; gap: 20px; margin-top: 5px; }
        .btn-play {
            background: #1DB954; padding: 10px 20px; 
            border-radius: 20px; font-weight: bold; border: none; color: white;
        }
    </style>
</head>
<body>

    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Busca una canción o artista...">
        <button id="search-btn">Buscar</button>
    </div>

    <div id="results"></div>

    <div class="player-bar">
        <div id="current-title">Ninguna canción seleccionada</div>
        <div class="controls">
            <button class="btn-play" id="btn-pause-play">Pausar</button>
        </div>
    </div>

    <script>
        const searchBtn = document.getElementById('search-btn');
        const queryInput = document.getElementById('query');
        const resultsDiv = document.getElementById('results');
        const currentTitle = document.getElementById('current-title');
        const pausePlayBtn = document.getElementById('btn-pause-play');

        const audio = new Audio();

        searchBtn.addEventListener('click', searchMusic);
        queryInput.addEventListener('keypress', function(e) { 
            if (e.key === 'Enter') searchMusic(); 
        });

        pausePlayBtn.addEventListener('click', function() {
            if (audio.paused) {
                audio.play();
                pausePlayBtn.textContent = 'Pausar';
            } else {
                audio.pause();
                pausePlayBtn.textContent = 'Reproducir';
            }
        });

        async function searchMusic() {
            const query = queryInput.value.trim();
            if (!query) return;

            resultsDiv.innerHTML = '<p style="text-align:center;">Buscando música en vivo...</p>';

            try {
                // Servidor de música alternativo libre de restricciones regionales o bloqueos de red
                const url = 'https://openwhyd.org' + encodeURIComponent(query) + '&format=json&limit=10';
                const response = await fetch(url);
                const data = await response.json();
                
                // Extraemos los resultados válidos del buscador abierto
                const songs = data.posts || data || [];

                resultsDiv.innerHTML = '';
                if (songs.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center;">No se encontraron resultados.</p>';
                    return;
                }

                songs.forEach(function(song) {
                    // Validamos que la canción tenga un título y un stream reproducible de audio
                    const title = song.name || 'Canción en línea';
                    const artist = song.uNm || 'Stream de Audio';
                    const cover = song.img || 'https://unsplash.com';
                    
                    // Extraemos el enlace directo de audio libre de anuncios
                    let preview = '';
                    if (song.src && song.src.id) {
                        preview = song.src.id;
                    } else if (song.eId) {
                        // Limpiamos formatos de enlaces indirectos
                        preview = song.eId.replace('/yt/', '').replace('/sc/', '');
                    }

                    if (!preview) return; // Si no tiene origen, saltamos a la siguiente

                    const songItem = document.createElement('div');
                    songItem.className = 'song-item';
                    
                    songItem.innerHTML = '<img src="' + cover + '" alt="Portada">' +
                        '<div class="song-info">' +
                            '<div class="song-title">' + title + '</div>' +
                            '<div class="song-author">' + artist + '</div>' +
                        '</div>';
                    
                    songItem.addEventListener('click', function() {
                        currentTitle.textContent = 'Cargando stream...';
                        
                        // Si es un enlace directo o un stream limpio de audio, lo reproducimos sin anuncios
                        if (preview.includes('http')) {
                            audio.src = preview;
                            audio.play().catch(function() {
                                alert('El stream está saturado. Intenta con otra canción de la lista.');
                            });
                        } else {
                            // Enrutamiento nativo secundario directo para evitar anuncios usando instancias estables de Invidious
                            audio.src = 'https://nerdvpn.de' + preview + '&itag=140';
                            audio.play().catch(function() {
                                // Alternativa directa si falla el primer nodo
                                audio.src = 'https://yewtu.be' + preview + '&itag=140';
                                audio.play().catch(function() {
                                    alert('El enlace de este audio caducó. Intenta tocar otro resultado.');
                                });
                            });
                        }
                        
                        currentTitle.textContent = 'Reproduciendo: ' + title;
                        pausePlayBtn.textContent = 'Pausar';
                    });
                    
                    resultsDiv.appendChild(songItem);
                });
            } catch (error) {
                resultsDiv.innerHTML = '<p style="text-align:center;">Buscador ocupado. Intenta presionar Buscar de nuevo.</p>';
            }
        }
    </script>
</body>
</html>
