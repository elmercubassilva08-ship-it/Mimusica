<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música MP3</title>
    <style>
        /* Mantenemos tu hermoso diseño original en rojo y gris oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        
        /* Lista de canciones encontradas abajo del buscador */
        #resultados {
            text-align: left;
            margin-bottom: 25px;
            max-height: 220px;
            overflow-y: auto;
        }
        .track-item {
            padding: 12px;
            background: #2f2f2f;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .track-item:hover { 
            background: #3f3f3f; 
            border: 1px solid #ff0000;
        }
        .track-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 12px; color: #888888; margin-top: 4px; }
        
        /* Tu reproductor nativo de audio blanco fijo */
        audio {
            width: 100%;
            margin-top: 15px;
            display: block !important;
        }
        .mensaje { text-align: center; color: #aaaaaa; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca un artista, género o canción...">
        <button id="btnBuscar" onclick="buscarMusicaMP3()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    
    <!-- Contenedor donde aparecerán las canciones listas para tocar -->
    <div id="resultados"></div>

    <audio id="reproductor" controls></audio>
</div>

<script>
async function buscarMusicaMP3() {
    const termino = document.getElementById('busqueda').value.trim();
    const contenedor = document.getElementById('resultados');
    const nowPlaying = document.getElementById('now-playing');
    
    if (!termino) return;
    
    contenedor.innerHTML = "<p class='mensaje'>Buscando canciones...</p>";
    nowPlaying.innerText = "Buscando...";

    try {
        // Conexión abierta permitida por GitHub Pages hacia la API oficial de Jamendo
        const dominio = "https://jamendo.com";
        const ruta = "/v3.0/tracks/?client_id=56d30c55&format=json&limit=10&search=";
        const urlFinal = dominio + ruta + encodeURIComponent(termino);
        
        const respuesta = await fetch(urlFinal);
        const datos = await respuesta.json();
        
        contenedor.innerHTML = "";
        
        if (!datos.results || datos.results.length === 0) {
            contenedor.innerHTML = "<p class='mensaje'>No se encontraron canciones exactas. Prueba con palabras genéricas como 'Rock', 'Pop', 'Love' o 'Dance'.</p>";
            nowPlaying.innerText = "Sin resultados.";
            return;
        }
        
        nowPlaying.innerText = "Resultados encontrados. Toca una canción abajo:";
        
        // Dibujamos las tarjetas de canciones en tu contenedor gris oscuro
        datos.results.forEach(cancion => {
            const item = document.createElement('div');
            item.className = 'track-item';
            item.innerHTML = `
                <div class="track-title">${cancion.name}</div>
                <div class="track-artist">${cancion.artist_name}</div>
            `;
            
            // Al hacer clic, alimenta el enlace .mp3 crudo directo al reproductor nativo blanco
            item.onclick = function() {
                const reproductor = document.getElementById('reproductor');
                nowPlaying.innerText = "Preparando MP3: " + cancion.name;
                
                reproductor.src = cancion.audio; // Stream de audio crudo directo libre de anuncios
                reproductor.load();
                
                reproductor.play().then(() => {
                    nowPlaying.innerText = "Reproduciendo: " + cancion.name;
                }).catch(e => {
                    // Los navegadores exigen que el usuario presione el botón físico de Play
                    nowPlaying.innerText = "Audio enlazado. Presiona PLAY en el reproductor blanco.";
                });
            };
            
            contenedor.appendChild(item);
        });
        
    } catch (error) {
        contenedor.innerHTML = "<p class='mensaje' style='color:#ff4444;'>Error en la red. Inténtalo de nuevo.</p>";
        nowPlaying.innerText = "Error de conexión.";
        console.error(error);
    }
}

// Soporte para presionar la tecla Enter en dispositivos móviles
document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        buscarMusicaMP3();
    }
});
</script>

</body>
</html>
