<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        /* Regresamos exactamente al diseño oscuro y rojo original que te gustó */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        #resultados {
            text-align: left;
            margin-bottom: 25px;
            max-height: 280px;
            overflow-y: auto;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #2f2f2f;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .track-item:hover { background: #3f3f3f; }
        .track-img { width: 50px; height: 50px; border-radius: 6px; margin-right: 12px; object-fit: cover; }
        .track-info { flex: 1; overflow: hidden; }
        .track-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-author { font-size: 12px; color: #aaaaaa; }
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        audio { width: 100%; margin-top: 15px; }
        .mensaje { text-align: center; color: #aaaaaa; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción o artista...">
        <button id="btnBuscar">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    <div id="resultados"></div>

    <audio id="reproductor" controls></audio>
</div>

<script>
// Escuchar el clic del botón y la tecla Enter en el teclado del móvil
document.getElementById('btnBuscar').addEventListener('click', buscarMusica);
document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        buscarMusica();
    }
});

async function buscarMusica() {
    const termino = document.getElementById('busqueda').value.trim();
    const contenedor = document.getElementById('resultados');
    if(!termino) return;
    
    contenedor.innerHTML = "<p class='mensaje'>Buscando canciones comerciales...</p>";

    try {
        // Corregido: URL completa usando una instancia abierta y limpia de Invidious
        const url = "https://tux.im" + encodeURIComponent(termino) + "&type=video";
        
        const respuesta = await fetch(url);
        const datos = await respuesta.json();
        
        contenedor.innerHTML = ""; 
        
        if (!datos || datos.length === 0) {
            contenedor.innerHTML = "<p class='mensaje'>No se encontraron resultados.</p>";
            return;
        }
        
        // Desplegar las canciones encontradas con sus carátulas oficiales
        datos.slice(0, 10).forEach(video => {
            const item = document.createElement('div');
            item.className = 'track-item';
            
            // Buscar la miniatura del video
            let portada = 'https://picsum.photos';
            if (video.videoThumbnails && video.videoThumbnails.length > 0) {
                portada = video.videoThumbnails[0].url;
            }
            
            item.innerHTML = `
                <img class="track-img" src="${portada}" alt="Portada">
                <div class="track-info">
                    <div class="track-title">${video.title}</div>
                    <div class="track-author">${video.author || 'Video Musical'}</div>
                </div>
            `;
            
            // Lógica al tocar la canción para extraer solo la pista de sonido (.mp3/.m4a) sin anuncios
            item.onclick = async () => {
                const reproductor = document.getElementById('reproductor');
                const nowPlaying = document.getElementById('now-playing');
                nowPlaying.innerText = "Cargando audio premium...";
                
                try {
                    const resAudio = await fetch("https://tux.im" + video.videoId);
                    const datosAudio = await resAudio.json();
                    
                    if (datosAudio.adaptiveFormats && datosAudio.adaptiveFormats.length > 0) {
                        // Buscar el archivo de audio puro
                        const streamAudio = datosAudio.adaptiveFormats.find(format => format.type && format.type.includes('audio/'));
                        
                        if(streamAudio && streamAudio.url) {
                            nowPlaying.innerText = "Reproduciendo: " + video.title;
                            reproductor.src = streamAudio.url;
                            reproductor.play();
                            return;
                        }
                    }
                    nowPlaying.innerText = "Error: Esta pista no permite streaming directo.";
                } catch (e) {
                    nowPlaying.innerText = "Servidor ocupado. Intenta con otra canción.";
                    console.error(e);
                }
            };
            
            contenedor.appendChild(item);
        });
    } catch (error) {
        contenedor.innerHTML = "<p class='mensaje' style='color:#ff4444;'>Error de red. Intenta buscar de nuevo.</p>";
        console.error(error);
    }
}
</script>

</body>
</html>
