<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música MP3</title>
    <style>
        /* Mantenemos tu hermoso diseño original en rojo y gris oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        
        /* Lista vertical limpia para las canciones MP3 */
        #resultados {
            text-align: left;
            margin-bottom: 25px;
            max-height: 250px;
            overflow-y: auto;
        }
        .track-item {
            padding: 12px;
            background: #2f2f2f;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .track-item:hover { background: #3f3f3f; }
        .track-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 12px; color: #888888; margin-top: 4px; }
        
        /* Tu reproductor nativo de audio gris */
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .mensaje { text-align: center; color: #aaaaaa; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca por género o nombre...">
        <button id="btnBuscar" onclick="buscarMusicaMP3()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    
    <!-- Aquí aparecerá tu lista de canciones listas para reproducir -->
    <div id="resultados"></div>

    <audio id="reproductor" controls></audio>
</div>

<script>
async function buscarMusicaMP3() {
    const termino = document.getElementById('busqueda').value.trim();
    const contenedor = document.getElementById('resultados');
    if (!termino) return;
    
    contenedor.innerHTML = "<p class='mensaje'>Buscando canciones MP3 libres de bloqueos...</p>";

    try {
        // Conexión directa y permitida a los servidores abiertos de Jamendo API
        const clientId = "56d30c55";
        const url = "https://jamendo.com" + clientId + "&format=json&limit=10&search=" + encodeURIComponent(termino);
        
        const respuesta = await fetch(url);
        const datos = await respuesta.json();
        
        contenedor.innerHTML = "";
        
        if (!datos.results || datos.results.length === 0) {
            contenedor.innerHTML = "<p class='mensaje'>No se encontraron archivos de audio para esa búsqueda. Intenta con un género musical (ej: Rock, Pop, Metal).</p>";
            return;
        }
        
        // Dibujar las canciones en tu contenedor gris oscuro
        datos.results.forEach(cancion => {
            const item = document.createElement('div');
            item.className = 'track-item';
            item.innerHTML = `
                <div class="track-title">${cancion.name}</div>
                <div class="track-artist">${cancion.artist_name}</div>
            `;
            
            // Al hacer clic, el archivo MP3 crudo se alimenta directo al reproductor
            item.onclick = function() {
                const reproductor = document.getElementById('reproductor');
                document.getElementById('now-playing').innerText = "Reproduciendo MP3: " + cancion.name;
                
                reproductor.src = cancion.audio; // Flujo MP3 directo sin anuncios intermedios
                reproductor.play();
            };
            
            contenedor.appendChild(item);
        });
        
    } catch (error) {
        contenedor.innerHTML = "<p class='mensaje' style='color:#ff4444;'>Error en el servidor de música. Inténtalo de nuevo.</p>";
        console.error(error);
    }
}

// Soporte para presionar la tecla Enter en dispositivos móviles
document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        buscarMusicaMP3();
    }
});
</script>

</body>
</html>
