<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        
        /* Contenedor adaptado para el reproductor de la librería oficial */
        #player-wrapper {
            margin-top: 15px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }
        iframe {
            width: 100%;
            height: 220px;
            border: none;
        }
        p { font-size: 13px; color: #888; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción o artista...">
        <button id="btnBuscar" onclick="buscarMusica()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    
    <!-- Aquí es donde la librería oficial de YouTube inyectará el reproductor -->
    <div id="player-wrapper">
        <div id="reproductor-oficial"></div>
    </div>

    <p style="margin-top: 15px;">Escribe tu canción. La librería oficial abrirá la lista de reproducción automáticamente.</p>
</div>

<script>
// 1. Cargar la librería oficial del Iframe Player de YouTube de forma asíncrona
var tag = document.createElement('script');
tag.src = "https://youtube.com";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

var player;
function onYouTubeIframeAPIReady() {
    // Inicializa el reproductor oculto listo para recibir música
    player = new YT.Player('reproductor-oficial', {
        height: '200',
        width: '100%',
        videoId: '', 
        playerVars: {
            'autoplay': 1,
            'controls': 1,
            'modestbranding': 1, // Quita logos excesivos de YouTube
            'rel': 0             // No muestra videos recomendados de otros canales
        }
    });
}

function buscarMusica() {
    const termino = document.getElementById('busqueda').value.trim();
    const nowPlaying = document.getElementById('now-playing');
    const playerWrapper = document.getElementById('player-wrapper');
    
    if(!termino) return;
    
    nowPlaying.innerText = "Conectando con la librería oficial...";
    playerWrapper.style.display = "block";
    
    // Convertimos la búsqueda en una URL segura de listas de reproducción de la API de YouTube
    // Esto fuerza a YouTube a generar una lista automática con las mejores canciones de lo que escribiste
    const linkBusquedaSegura = "https://youtube.com" + encodeURIComponent(termino) + "&autoplay=1&modestbranding=1";
    
    // Inyectamos el flujo oficial dentro del cuadro protector de tu aplicación
    document.getElementById('player-wrapper').innerHTML = `<iframe src="${linkBusquedaSegura}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    
    nowPlaying.innerText = "Reproduciendo mezcla de: " + termino;
}

// Permitir presionar la tecla Enter en teléfonos móviles
document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        buscarMusica();
    }
});
</script>

</body>
</html>
