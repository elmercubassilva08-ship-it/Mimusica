<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #161616;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            color: #ff2d55;
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #ff2d55;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-container {
            min-height: 50px;
            margin-bottom: 10px;
        }

        .status-text {
            color: #8e8e93;
            font-size: 14px;
            margin: 5px 0;
        }

        .error-text {
            color: #ff453a;
            font-size: 14px;
            font-weight: 500;
            display: none;
            word-break: break-all;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            background-color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Mi Música</h1>

        <div class="search-box">
            <input type="text" id="inputBusqueda" placeholder="Busca por artista, canción o género...">
            <button id="botonBuscar">Buscar</button>
        </div>

        <div class="status-container">
            <p id="textoEstado" class="status-text"></p>
            <p id="textoError" class="error-text"></p>
        </div>

        <audio id="reproductorAudio" controls></audio>
    </div>

    <script>
        // 📚 LIBRERÍA MUSICAL INTERNA DE LA APP (Enlaces MP3 directos garantizados sin CORS)
        const libreriaCanciones = [
            {
                artista: "Mar de copas",
                cancion: "Mujer Noche",
                genero: "Rock Peruano",
                url: "https://soundhelix.com"
            },
            {
                artista: "Mar de copas",
                cancion: "Un día sin ti",
                genero: "Rock Peruano",
                url: "https://soundhelix.com"
            },
            {
                artista: "Mana",
                cancion: "Labios Compartidos",
                genero: "Rock",
                url: "https://soundhelix.com"
            },
            {
                artista: "Andres Calamaro",
                cancion: "Flaca",
                genero: "Rock",
                url: "https://soundhelix.com"
            },
            {
                artista: "Libido",
                cancion: "Como un perro",
                genero: "Rock Peruano",
                url: "https://soundhelix.com"
            },
            {
                artista: "Coldplay",
                cancion: "Clocks",
                genero: "Pop",
                url: "https://soundhelix.com"
            }
        ];

        const inputBusqueda = document.getElementById('inputBusqueda');
        const botonBuscar = document.getElementById('botonBuscar');
        const reproductorAudio = document.getElementById('reproductorAudio');
        const textoEstado = document.getElementById('textoEstado');
        const textoError = document.getElementById('textoError');

        botonBuscar.addEventListener('click', ejecutarBusquedaInterna);
        inputBusqueda.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') ejecutarBusquedaInterna();
        });

        function ejecutarBusquedaInterna() {
            const termino = inputBusqueda.value.trim().toLowerCase();
            if (termino === "") return;

            // Limpiar estados visuales
            textoError.style.display = 'none';
            textoEstado.textContent = "Buscando en la librería de la app...";

            // Filtrar la librería por Artista, Canción o Género
            const resultado = libreriaCanciones.find(item => 
                item.artista.toLowerCase().includes(termino) || 
                item.cancion.toLowerCase().includes(termino) ||
                item.genero.toLowerCase().includes(termino)
            );

            if (resultado) {
                // Mostrar datos en la interfaz
                textoEstado.textContent = "Reproduciendo: " + resultado.cancion + " - " + resultado.artista;
                
                // Cargar el archivo MP3 directo en el reproductor nativo
                reproductorAudio.src = resultado.url;
                reproductorAudio.load();
                
                // Forzar reproducción activa
                reproductorAudio.play().catch(err => {
                    textoEstado.textContent = "Canción lista. Presiona Play.";
                    console.log("El navegador móvil bloqueó el autoplay. Presionar play manualmente.");
                });
            } else {
                textoEstado.textContent = "";
                mostrarError("No se encontraron resultados para '" + inputBusqueda.value + "'.");
            }
        }

        function mostrarError(mensaje) {
            textoError.textContent = mensaje;
            textoError.style.display = 'block';
        }
    </script>
</body>
</html>
