<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        /* Tu diseño original impecable en rojo y gris oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        
        /* Contenedor del reproductor que aparecerá abajo */
        .player-wrapper {
            margin-top: 15px;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            display: none; /* Se activa al buscar */
            background-color: #000000;
        }
        iframe {
            width: 100%;
            height: 300px;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción o artista...">
        <button id="btnBuscar" onclick="buscarMusica()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    
    <!-- El cuadro interno que cargará la música dentro de tu app -->
    <div id="player-wrapper" class="player-wrapper">
        <iframe id="reproductor" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
</div>

<script>
function buscarMusica() {
    const termino = document.getElementById('busqueda').value.trim();
    const wrapper = document.getElementById('player-wrapper');
    const iframe = document.getElementById('reproductor');
    const nowPlaying = document.getElementById('now-playing');
    
    if (!termino) return;
    
    // Cambiamos el texto de inmediato para saber que el botón sí respondió
    nowPlaying.innerText = "Cargando música desde la biblioteca oficial...";
    
    // Usamos el formato de búsqueda oficial que YouTube sí permite embeber de forma legal
    const urlLimpia = "https://youtube.com" + encodeURIComponent(termino) + "&autoplay=1&modestbranding=1";
    
    // Inyectamos la URL directamente en el cuadro y lo mostramos en pantalla
    iframe.src = urlLimpia;
    wrapper.style.display = "block";
    
    nowPlaying.innerText = "Reproduciendo mezcla de: " + termino;
}

// Soporte para que funcione al presionar la tecla Enter en teclados móviles
document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        buscarMusica();
    }
});
</script>

</body>
</html>
