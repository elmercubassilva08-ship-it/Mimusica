<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Música</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tu archivo CSS -->
</head>
<body>

    <div class="app-container">
        <h2>🎵 Mi Música</h2>
        
        <!-- Barra de búsqueda -->
        <div class="search-box">
            <input type="text" id="inputBuscar" placeholder="Buscar artista o canción..." value="Maná">
            <button id="btnBuscar">Buscar</button>
        </div>

        <!-- Lista donde se cargarán las canciones dinámicamente -->
        <div id="listaCanciones" class="songs-list">
            <!-- JavaScript meterá las canciones aquí -->
        </div>

        <!-- Reproductor inferior fijo -->
        <div class="player-footer">
            <p id="textoReproduciendo">Ninguna canción seleccionada</p>
            <!-- Elemento de audio nativo del navegador -->
            <audio id="reproductorAudio" controls autoplay></audio>
        </div>
    </div>

    <!-- Tu archivo de lógica JavaScript -->
    <script src="script.js"></script>
</body>
</html>
