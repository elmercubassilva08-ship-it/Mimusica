<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        #resultados {
            text-align: left;
            margin-bottom: 25px;
            max-height: 280px;
            overflow-y: auto;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #2f2f2f;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .track-item:hover { background: #3f3f3f; }
        .track-img { width: 50px; height: 50px; border-radius: 6px; margin-right: 12px; object-fit: cover; }
        .track-info { flex: 1; overflow: hidden; }
        .track-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-author { font-size: 12px; color: #aaaaaa; }
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción o artista...">
        <button onclick="buscarMusica()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    <div id="resultados"></div>

    <audio id="reproductor" controls></audio>
</div>

<script>
async function buscarMusica() {
    const termino = document.getElementById('busqueda').value;
    const contenedor = document.getElementById('resultados');
    if(!termino) return;
    
    contenedor.innerHTML = "<p style='color:#aaaaaa; text-align:center;'>Buscando en la base de datos global...</p>";

    try {
        // Usamos una instancia pública de Piped (un buscador de YouTube libre de rastreadores y anuncios)
        const url = `https://kavin.rocks{encodeURIComponent(termino)}&filter=videos`;
        
        const respuesta = await fetch(url);
        const datos = await respuesta.json();
        
        contenedor.innerHTML = ""; 
        
        if (!datos.streams || datos.streams.length === 0) {
            contenedor.innerHTML = "<p style='color:#aaaaaa; text-align:center;'>No se encontraron resultados.</p>";
            return;
        }
        
        // Filtramos y mostramos los resultados musicales
        datos.streams.forEach(video => {
            const item = document.createElement('div');
            item.className = 'track-item';
            
            // Estructura visual con la miniatura del video/canción
            item.innerHTML = `
                <img class="track-img" src="${video.thumbnail}" alt="Portada">
                <div class="track-info">
                    <div class="track-title">${video.title}</div>
                    <div class="track-author">${video.uploaderName}</div>
                </div>
            `;
            
            // Al hacer clic, extrae directamente el flujo de audio limpio
            item.onclick = async () => {
                const reproductor = document.getElementById('reproductor');
                document.getElementById('now-playing').innerText = `Cargando audio: ${video.title}`;
                
                try {
                    // Consultamos los enlaces directos del video
                    const resAudio = await fetch(`https://kavin.rocks{video.url.split('=')[1]}`);
                    const datosAudio = await resAudio.json();
                    
                    // Buscamos un formato que sea solo de audio (m4a o webm) para ahorrar datos y cargar rápido
                    const audioStream = datosAudio.audioStreams.find(stream => stream.mimeType.includes('audio')) || datosAudio.audioStreams[0];
                    
                    if(audioStream && audioStream.url) {
                        document.getElementById('now-playing').innerText = `Reproduciendo: ${video.title}`;
                        reproductor.src = audioStream.url;
                        reproductor.play();
                    } else {
                        document.getElementById('now-playing').innerText = "Error al obtener el audio de esta canción.";
                    }
                } catch (e) {
                    document.getElementById('now-playing').innerText = "Servidor ocupado. Intenta con otra canción.";
                    console.error(e);
                }
            };
            
            contenedor.appendChild(item);
        });
    } catch (error) {
        contenedor.innerHTML = "<p style='color:#ff4444; text-align:center;'>Error de conexión. Inténtalo de nuevo.</p>";
        console.error(error);
    }
}
</script>

</body>
</html>
