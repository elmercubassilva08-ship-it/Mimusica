<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música MP3</title>
    <style>
        /* Mantenemos tu hermoso diseño original en rojo y gris oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        
        /* Tu reproductor nativo de audio blanco siempre visible y limpio */
        audio {
            width: 100%;
            margin-top: 15px;
            display: block !important;
        }
        p { font-size: 13px; color: #888; line-height: 1.4; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Escribe un género (ej: rock, pop, jazz)...">
        <button id="btnBuscar" onclick="conectarEstacion()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna estación seleccionada</div>

    <!-- Tu reproductor nativo inmune a bloqueos de pantalla gris -->
    <audio id="reproductor" controls></audio>
    
    <p>Escribe tu género musical favorito. Al presionar buscar, tu app sintonizará una transmisión de audio digital en vivo sin publicidad intrusiva.</p>
</div>

<script>
function conectarEstacion() {
    const termino = document.getElementById('busqueda').value.trim().toLowerCase();
    const reproductor = document.getElementById('reproductor');
    const nowPlaying = document.getElementById('now-playing');
    
    if (!termino) return;
    
    nowPlaying.innerText = "Sintonizando señal de audio digital...";
    
    // Lista de transmisiones de audio MP3 estables y libres de bloqueos CORS
    let urlStreaming = "";
    let nombreEstacion = "";
    
    if (termino.includes("rock")) {
        urlStreaming = "https://rockantenne.de";
        nombreEstacion = "Estación: Rock Antenne Live (MP3 Puro)";
    } else if (termino.includes("pop")) {
        urlStreaming = "https://181.fm";
        nombreEstacion = "Estación: 181.FM Awesome 80s (MP3 Puro)";
    } else if (termino.includes("jazz")) {
        urlStreaming = "https://jazzradio.com";
        nombreEstacion = "Estación: Smooth Jazz Radio (MP3 Puro)";
    } else {
        // Estación clásica de éxitos globales por defecto si escribe otra cosa
        urlStreaming = "https://181fm.com";
        nombreEstacion = "Estación: Hits Globales Mix (MP3 Puro)";
    }
    
    // Inyectamos la URL cruda directamente en tu reproductor blanco nativo
    reproductor.src = urlStreaming;
    reproductor.load();
    
    reproductor.play().then(() => {
        nowPlaying.innerText = nombreEstacion;
    }).catch(e => {
        nowPlaying.innerText = "Señal enlazada. Presiona PLAY en el reproductor blanco.";
    });
}

// Soporte para presionar la tecla Enter en dispositivos móviles
document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        conectarEstacion();
    }
});
</script>

</body>
</html>
