<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #161616;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            color: #ff2d55;
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #ff2d55;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-container {
            min-height: 50px;
            margin-bottom: 10px;
        }

        .status-text {
            color: #8e8e93;
            font-size: 14px;
            margin: 5px 0;
        }

        .error-text {
            color: #ff453a;
            font-size: 14px;
            font-weight: 500;
            display: none;
            word-break: break-all;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            background-color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Mi Música</h1>

        <div class="search-box">
            <input type="text" id="inputBusqueda" placeholder="Escribe un artista o canción...">
            <button id="botonBuscar">Buscar</button>
        </div>

        <div class="status-container">
            <p id="textoEstado" class="status-text"></p>
            <p id="textoError" class="error-text"></p>
        </div>

        <audio id="reproductorAudio" controls></audio>
    </div>

    <script>
        const inputBusqueda = document.getElementById('inputBusqueda');
        const botonBuscar = document.getElementById('botonBuscar');
        const reproductorAudio = document.getElementById('reproductorAudio');
        const textoEstado = document.getElementById('textoEstado');
        const textoError = document.getElementById('textoError');

        botonBuscar.addEventListener('click', buscarMusicaReal);
        inputBusqueda.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarMusicaReal();
        });

        function buscarMusicaReal() {
            const termino = inputBusqueda.value.trim();
            if (termino === "") return;

            // Limpiar estados visuales anteriores
            textoError.style.display = 'none';
            textoError.textContent = '';
            textoEstado.textContent = "Buscando canción en servidores...";

            // CORREGIDO: Se eliminó el espacio en blanco del nombre de la variable para evitar que se congele
            const urlDeezerOriginal = 'https://deezer.com' + encodeURIComponent(termino) + '&limit=1';
            const urlAPI = 'https://herokuapp.com' + urlDeezerOriginal;

            fetch(urlAPI)
                .then(response => {
                    if (!response.ok) throw new Error("Servidor intermedio ocupado o requiere activación. Inténtalo de nuevo.");
                    return response.json();
                })
                .then(data => {
                    if (!data.data || data.data.length === 0) {
                        throw new Error("No se encontraron canciones para esta búsqueda.");
                    }

                    const cancion = data.data[0];
                    
                    // Mostrar los datos en la pantalla del celular
                    textoEstado.textContent = "Reproduciendo: " + cancion.title + " - " + cancion.artist.name;

                    // Forzar que la música viaje por conexión segura HTTPS obligatoria en GitHub
                    const urlAudioSegura = cancion.preview.replace(/^http:\/\//i, 'https://');

                    // Cargar el archivo de sonido directamente en el reproductor blanco inferior
                    reproductorAudio.src = urlAudioSegura;
                    
                    // Iniciar la música
                    reproductorAudio.play().catch(err => {
                        textoEstado.textContent = "Canción lista. Presiona el botón Play blanco.";
                        console.log("El navegador bloqueó el inicio automático. Requiere play del usuario.");
                    });
                })
                .catch(error => {
                    console.error("Error del sistema:", error);
                    textoEstado.textContent = "";
                    
                    // Si el proxy gratuito requiere un permiso rápido de activación en pantalla
                    if (error.message.includes("requiere activación")) {
                        mostrarError("Por favor, abre una vez esta web en tu celular para activar el servidor de música: https://herokuapp.comcorsdemo y luego regresa aquí.");
                    } else {
                        mostrarError("Error en la red. Inténtalo de nuevo.");
                    }
                });
        }

        function mostrarError(mensaje) {
            textoError.textContent = mensaje;
            textoError.style.display = 'block';
        }
    </script>
</body>
</html>
