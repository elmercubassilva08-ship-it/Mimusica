<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        /* Mantenemos intacto tu hermoso diseño original en rojo y oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        
        /* El buscador ahora es un formulario web nativo e indestructible */
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        p { font-size: 14px; color: #aaaaaa; line-height: 1.5; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <!-- Formulario directo al buscador global libre de anuncios de YouTube (Invidious) -->
    <form action="https://yewtu.be" method="GET" target="_blank" class="search-box">
        <input type="text" name="q" placeholder="Busca cualquier canción o artista..." required>
        <button type="submit">Buscar</button>
    </form>

    <p>Escribe tu artista o canción favorita. Al presionar Buscar, el navegador abrirá de inmediato todo el catálogo musical del mundo libre de publicidad.</p>
</div>

</body>
</html>
