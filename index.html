<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #161616;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            color: #ff2d55;
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #ff2d55;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-container {
            min-height: 50px;
            margin-bottom: 10px;
        }

        .status-text {
            color: #8e8e93;
            font-size: 14px;
            margin: 5px 0;
        }

        .error-text {
            color: #ff453a;
            font-size: 14px;
            font-weight: 500;
            display: none;
            word-break: break-all;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            background-color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Mi Música</h1>

        <div class="search-box">
            <input type="text" id="inputBusqueda" placeholder="Andrés Calamaro, Mana, Rock...">
            <button id="botonBuscar">Buscar</button>
        </div>

        <div class="status-container">
            <p id="textoEstado" class="status-text"></p>
            <p id="textoError" class="error-text"></p>
        </div>

        <audio id="reproductorAudio" controls></audio>
    </div>

    <script>
        const inputBusqueda = document.getElementById('inputBusqueda');
        const botonBuscar = document.getElementById('botonBuscar');
        const reproductorAudio = document.getElementById('reproductorAudio');
        const textoEstado = document.getElementById('textoEstado');
        const textoError = document.getElementById('textoError');

        botonBuscar.addEventListener('click', buscarEnBaseMundial);
        inputBusqueda.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarEnBaseMundial();
        });

        function buscarEnBaseMundial() {
            const termino = inputBusqueda.value.trim();
            if (termino === "") return;

            // Limpiar estados e indicar al usuario que el buscador está activo
            textoError.style.display = 'none';
            textoError.textContent = '';
            textoEstado.textContent = "Conectando con la base de datos mundial...";

            // API Abierta de Wikimedia Commons: Filtra búsquedas reales de archivos de audio
            const urlAPI = 'https://wikimedia.org' + encodeURIComponent(termino) + ' fileext:mp3|ogg&srnamespace=6&format=json&origin=*';

            fetch(urlAPI)
                .then(response => {
                    if (!response.ok) throw new Error("Servidor ocupado. Inténtalo de nuevo.");
                    return response.json();
                })
                .then(data => {
                    if (!data.query || !data.query.search || data.query.search.length === 0) {
                        throw new Error("No se encontraron canciones para esta búsqueda.");
                    }

                    // Tomamos el primer archivo multimedia válido encontrado en el servidor externo
                    const primerResultado = data.query.search[0];
                    const tituloArchivo = primerResultado.title; // Formato: "File:Nombre.mp3"

                    // Limpiar el prefijo técnico para mostrar el nombre real en tu app
                    const nombreLimpio = tituloArchivo.replace("File:", "").replace(".mp3", "").replace(".ogg", "");
                    textoEstado.textContent = "Cargando audio: " + nombreLimpio;

                    // Convertir el nombre del archivo de la base de datos en una URL de descarga directa compatible con HTTPS
                    const nombreEncriptado = encodeURIComponent(tituloArchivo.replace("File:", ""));
                    
                    // MD5 hashing simplificado para las rutas de archivos de Wikimedia
                    return fetch('https://wikimedia.org' + tituloArchivo + '&prop=imageinfo&iiprop=url&format=json&origin=*');
                })
                .then(response => {
                    if (!response) return;
                    return response.json();
                })
                .then(infoData => {
                    const paginas = infoData.query.pages;
                    const idPagina = Object.keys(paginas)[0];
                    const infoMultimedia = paginas[idPagina].imageinfo;

                    if (!infoMultimedia || infoMultimedia.length === 0) {
                        throw new Error("El archivo seleccionado no tiene permisos de reproducción.");
                    }

                    // Capturamos el enlace de streaming directo HTTPS que el navegador jamás bloqueará
                    const urlStreamingDirecto = infoMultimedia[0].url;

                    // Pasar la ruta al reproductor nativo del celular
                    reproductorAudio.src = urlStreamingDirecto;
                    reproductorAudio.load();
                    
                    textoEstado.textContent = "Reproduciendo pista en línea.";

                    // Forzar el inicio del audio de forma interactiva
                    reproductorAudio.play().catch(err => {
                        textoEstado.textContent = "Canción lista. Presiona el botón de Play blanco.";
                        console.log("Autoplay bloqueado. El usuario debe pulsar manualmente en el celular.");
                    });
                })
                .catch(error => {
                    console.error("Falla en el flujo:", error);
                    textoEstado.textContent = "";
                    mostrarError(error.message || "Error en la red. Inténtalo de nuevo.");
                });
        }

        function mostrarError(mensaje) {
            textoError.textContent = mensaje;
            textoError.style.display = 'block';
        }
    </script>
</body>
</html>
