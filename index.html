<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #161616;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            color: #ff2d55;
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #ff2d55;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-container {
            min-height: 50px;
            margin-bottom: 10px;
        }

        .status-text {
            color: #8e8e93;
            font-size: 14px;
            margin: 5px 0;
        }

        .error-text {
            color: #ff453a;
            font-size: 14px;
            font-weight: 500;
            display: none;
            word-break: break-all;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            background-color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Mi Música</h1>

        <div class="search-box">
            <!-- Quitamos el atributo 'value' para que el buscador inicie limpio y vacío -->
            <input type="text" id="inputBusqueda" placeholder="Escribe un artista o canción...">
            <button id="botonBuscar">Buscar</button>
        </div>

        <div class="status-container">
            <p id="textoEstado" class="status-text"></p>
            <p id="textoError" class="error-text"></p>
        </div>

        <audio id="reproductorAudio" controls></audio>
    </div>

    <script>
        const inputBusqueda = document.getElementById('inputBusqueda');
        const botonBuscar = document.getElementById('botonBuscar');
        const reproductorAudio = document.getElementById('reproductorAudio');
        const textoEstado = document.getElementById('textoEstado');
        const textoError = document.getElementById('textoError');

        // Asignamos la función correctamente sin ejecutarla de inmediato
        botonBuscar.addEventListener('click', buscarMusicaApple);
        inputBusqueda.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarMusicaApple();
        });

        function buscarMusicaApple() {
            const termino = inputBusqueda.value.trim();
            
            // Si el usuario presiona buscar con el cuadro vacío, no hace nada
            if (termino === "") {
                textoEstado.textContent = "Por favor, escribe algo para buscar.";
                return;
            }

            // Limpiar estados visuales
            textoError.style.display = 'none';
            textoError.textContent = '';
            textoEstado.textContent = "Buscando pista en línea...";

            // API global de iTunes: ultra rápida, sin anuncios y 100% compatible con HTTPS/CORS
            const urlAPI = `https://apple.com{encodeURIComponent(termino)}&media=music&limit=1`;

            fetch(urlAPI)
                .then(response => {
                    if (!response.ok) throw new Error("Error al conectar con el servidor de música.");
                    return response.json();
                })
                .then(data => {
                    if (!data.results || data.results.length === 0) {
                        throw new Error("No se encontraron canciones para esta búsqueda.");
                    }

                    const cancion = data.results[0];
                    
                    // Actualizar textos con el resultado real encontrado
                    textoEstado.textContent = `Reproduciendo: ${cancion.trackName} - ${cancion.artistName}`;

                    // Asignar el enlace de audio directo (.m4a/.mp3) al reproductor nativo
                    reproductorAudio.src = cancion.previewUrl;
                    
                    // Forzar reproducción
                    reproductorAudio.play().catch(err => {
                        console.log("Reproducción automática pausada. Requiere clic en Play.");
                    });
                })
                .catch(error => {
                    console.error("Error detectado:", error);
                    textoEstado.textContent = "";
                    
                    if (error.message.includes('Failed to fetch')) {
                        mostrarError("Error en la red. Verifica tu conexión a internet.");
                    } else {
                        mostrarError(error.message);
                    }
                });
        }

        function mostrarError(mensaje) {
            textoError.textContent = mensaje;
            textoError.style.display = 'block';
        }
    </script>
</body>
</html>
