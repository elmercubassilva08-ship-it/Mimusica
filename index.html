<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #161616;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            color: #ff2d55;
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #ff2d55;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-container {
            min-height: 50px;
            margin-bottom: 10px;
        }

        .status-text {
            color: #8e8e93;
            font-size: 14px;
            margin: 5px 0;
        }

        .error-text {
            color: #ff453a;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            background-color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Mi Música</h1>

        <div class="search-box">
            <input type="text" id="inputBusqueda" placeholder="Mar de copas" value="Mar de copas">
            <button id="botonBuscar">Buscar</button>
        </div>

        <div class="status-container">
            <p id="textoEstado" class="status-text"></p>
            <p id="textoError" class="error-text"></p>
        </div>

        <audio id="reproductorAudio" controls></audio>
    </div>

    <script>
        const inputBusqueda = document.getElementById('inputBusqueda');
        const botonBuscar = document.getElementById('botonBuscar');
        const reproductorAudio = document.getElementById('reproductorAudio');
        const textoEstado = document.getElementById('textoEstado');
        const textoError = document.getElementById('textoError');

        botonBuscar.addEventListener('click', buscarMusicaReal);
        inputBusqueda.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarMusicaReal();
        });

        function buscarMusicaReal() {
            const termino = inputBusqueda.value.trim();
            if (termino === "") return;

            // Limpiar errores visuales anteriores
            textoError.style.display = 'none';
            textoEstado.textContent = "Buscando en servidores de audio en línea...";

            // API Abierta de Internet Archive (Filtra por formato MP3 y palabras clave de búsqueda)
            const urlAPI = `https://archive.org{encodeURIComponent(termino)}+AND+mediatype:audio&fl[]=identifier,title&output=json`;

            fetch(urlAPI)
                .then(response => {
                    if (!response.ok) throw new Error("Servidor ocupado. Inténtalo de nuevo.");
                    return response.json();
                })
                .then(data => {
                    const solicitudes = data.response.docs;
                    
                    if (!solicitudes || solicitudes.length === 0) {
                        throw new Error("No se encontraron canciones disponibles.");
                    }

                    // Tomamos el primer contenedor de audio válido encontrado
                    const itemValido = solicitudes[0];
                    const idContenedor = itemValido.identifier;
                    const tituloCancion = itemValido.title || termino;

                    textoEstado.textContent = `Conectando pista: ${tituloCancion}`;

                    // Segunda consulta para extraer los archivos MP3 exactos dentro de ese contenedor
                    return fetch(`https://archive.org{idContenedor}`);
                })
                .then(response => {
                    if (!response) return; // Si falló el paso anterior
                    return response.json();
                })
                .then(metaData => {
                    if (!metaData) return;

                    // Filtrar los archivos que sean estrictamente formato MP3 para el reproductor HTML5
                    const archivosMp3 = metaData.files.filter(f => f.name.endsWith('.mp3'));

                    if (archivosMp3.length === 0) {
                        throw new Error("El archivo encontrado no tiene un formato compatible.");
                    }

                    // Construir la URL de streaming directo usando HTTPS nativo (Cero bloqueos CORS)
                    const nombreArchivo = archivosMp3[0].name;
                    const urlStreamingDirecto = `https://archive.org{metaData.metadata.identifier}/${encodeURIComponent(nombreArchivo)}`;

                    // Insertar ruta en el reproductor blanco
                    reproductorAudio.src = urlStreamingDirecto;
                    textoEstado.textContent = `Reproduciendo: ${metaData.metadata.title || "Audio En Línea"}`;
                    
                    // Forzar inicio de reproducción
                    reproductorAudio.play().catch(err => {
                        textoEstado.textContent = "Listo para reproducir.";
                        console.log("Reproducción automática pausada por el navegador. Presiona Play.");
                    });
                })
                .catch(error => {
                    console.error("Error técnico del sistema:", error);
                    textoEstado.textContent = "Error de conexión.";
                    
                    if (error.message.includes('Failed to fetch')) {
                        mostrarError("Error en la red. Inténtalo de nuevo.");
                    } else {
                        mostrarError(error.message);
                    }
                });
        }

        function mostrarError(mensaje) {
            textoError.textContent = mensaje;
            textoError.style.display = 'block';
        }
    </script>
</body>
</html>
