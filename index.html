<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música MP3</title>
    <style>
        /* Mantenemos tu diseño original impecable en rojo y gris oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        
        /* Lista vertical limpia para las canciones MP3 */
        #resultados {
            text-align: left;
            margin-bottom: 25px;
            max-height: 250px;
            overflow-y: auto;
        }
        .track-item {
            padding: 12px;
            background: #2f2f2f;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .track-item:hover { background: #3f3f3f; }
        .track-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 12px; color: #888888; margin-top: 4px; }
        
        /* Tu reproductor nativo de audio gris */
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .mensaje { text-align: center; color: #aaaaaa; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción o artista...">
        <button id="btnBuscar" onclick="buscarMusicaMP3()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    
    <!-- Aquí aparecerá tu lista de canciones listas para reproducir -->
    <div id="resultados"></div>

    <audio id="reproductor" controls></audio>
</div>

<script>
function buscarMusicaMP3() {
    const termino = document.getElementById('busqueda').value.trim();
    const contenedor = document.getElementById('resultados');
    if (!termino) return;
    
    contenedor.innerHTML = "<p class='mensaje'>Buscando archivos MP3 globales...</p>";
    
    // Eliminamos scripts de búsquedas antiguas para mantener limpia la página
    const scriptViejo = document.getElementById('jsonp-deezer');
    if (scriptViejo) scriptViejo.remove();

    // CONEXIÓN CORREGIDA: Construcción matemática limpia del enlace JSONP oficial
    const urlBase = "https://deezer.com";
    const parametros = "&output=jsonp&callback=procesarMP3";
    const urlCompleta = urlBase + encodeURIComponent(termino) + parametros;

    // Inyectamos de forma dinámica el puente de comunicación inmune a bloqueos
    const script = document.createElement('script');
    script.id = 'jsonp-deezer';
    script.src = urlCompleta;
    document.body.appendChild(script);
}

// Esta función recibe las canciones comerciales y las dibuja en tu lista
window.procesarMP3 = function(datos) {
    const contenedor = document.getElementById('resultados');
    contenedor.innerHTML = "";
    
    if (!datos || !datos.data || datos.data.length === 0) {
        contenedor.innerHTML = "<p class='mensaje'>No se encontraron canciones. Intenta con otro nombre.</p>";
        return;
    }
    
    // Desplegamos los primeros 10 resultados dentro de tu caja gris
    datos.data.slice(0, 10).forEach(cancion => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.innerHTML = `
            <div class="track-title">${cancion.title}</div>
            <div class="track-artist">${cancion.artist.name}</div>
        `;
        
        // Al tocar el elemento, alimentamos el stream de audio puro al reproductor nativo
        item.onclick = function() {
            const reproductor = document.getElementById('reproductor');
            document.getElementById('now-playing').innerText = "Reproduciendo MP3: " + cancion.title;
            
            reproductor.src = cancion.preview; // Archivo de audio limpio sin anuncios intermedios
            reproductor.play();
        };
        
        contenedor.appendChild(item);
    });
};

// Soporte para presionar la tecla Enter en dispositivos móviles
document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        buscarMusicaMP3();
    }
});
</script>

</body>
</html>
