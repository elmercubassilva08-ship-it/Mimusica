<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #161616;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            color: #ff2d55;
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #ff2d55;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-container {
            min-height: 50px;
            margin-bottom: 10px;
        }

        .status-text {
            color: #8e8e93;
            font-size: 14px;
            margin: 5px 0;
        }

        .error-text {
            color: #ff453a;
            font-size: 14px;
            font-weight: 500;
            display: none;
            word-break: break-all;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            background-color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Mi Música</h1>

        <div class="search-box">
            <input type="text" id="inputBusqueda" placeholder="Escribe un artista o canción..." value="Verano traidor">
            <button id="botonBuscar">Buscar</button>
        </div>

        <div class="status-container">
            <p id="textoEstado" class="status-text"></p>
            <p id="textoError" class="error-text"></p>
        </div>

        <audio id="reproductorAudio" controls></audio>
    </div>

    <script>
        const inputBusqueda = document.getElementById('inputBusqueda');
        const botonBuscar = document.getElementById('botonBuscar');
        const reproductorAudio = document.getElementById('reproductorAudio');
        const textoEstado = document.getElementById('textoEstado');
        const textoError = document.getElementById('textoError');

        botonBuscar.addEventListener('click', buscarMusicaJSONP);
        inputBusqueda.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarMusicaJSONP();
        });

        // 🌟 FUNCIÓN GLOBAL PARA PROCESAR LA RESPUESTA DE ITUNES (Evita el bloqueo de CORS)
        window.procesarRespuestaMusica = function(data) {
            // Eliminar el script temporal creado para la consulta
            const scriptViejo = document.getElementById('script-jsonp');
            if (scriptViejo) scriptViejo.remove();

            if (!data.results || data.results.length === 0) {
                textoEstado.textContent = "";
                mostrarError("No se encontraron canciones para esta búsqueda.");
                return;
            }

            const cancion = data.results[0];
            
            // Mostrar info en pantalla
            textoEstado.textContent = `Reproduciendo: ${cancion.trackName} - ${cancion.artistName}`;

            // Asignar y reproducir el audio
            reproductorAudio.src = cancion.previewUrl;
            reproductorAudio.play().catch(err => {
                textoEstado.textContent = "Canción lista. Dale play.";
                console.log("Reproducción automática pausada por el navegador.");
            });
        };

        function buscarMusicaJSONP() {
            const termino = inputBusqueda.value.trim();
            if (termino === "") return;

            // Resetear la interfaz
            textoError.style.display = 'none';
            textoEstado.textContent = "Buscando canción...";

            // Eliminar scripts JSONP colgados de búsquedas anteriores si existen
            const scriptViejo = document.getElementById('script-jsonp');
            if (scriptViejo) scriptViejo.remove();

            // Creamos una solicitud JSONP inyectando un tag <script> dinámico en el HTML.
            // Al agregar '&callback=procesarRespuestaMusica', saltamos el bloqueo CORS por completo.
            const urlAPI = `https://apple.com{encodeURIComponent(termino)}&media=music&limit=1&callback=procesarRespuestaMusica`;

            const nuevoScript = document.createElement('script');
            nuevoScript.id = 'script-jsonp';
            nuevoScript.src = urlAPI;

            // Si hay un error real de internet (offline), capturarlo aquí
            nuevoScript.onerror = function() {
                textoEstado.textContent = "";
                mostrarError("Error en la red o el servidor no responde.");
            };

            // Inyectar el script para lanzar la búsqueda automáticamente
            document.body.appendChild(nuevoScript);
        }

        function mostrarError(mensaje) {
            textoError.textContent = mensaje;
            textoError.style.display = 'block';
        }
    </script>
</body>
</html>
