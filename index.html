<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música MP3</title>
    <style>
        /* Mantenemos tu hermoso diseño original en rojo y gris oscuro */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff0000; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #cc0000; }
        
        #now-playing { font-size: 14px; color: #aaaaaa; margin-bottom: 15px; font-style: italic; }
        
        /* Lista vertical limpia para las canciones MP3 */
        #resultados {
            text-align: left;
            margin-bottom: 25px;
            max-height: 250px;
            overflow-y: auto;
        }
        .track-item {
            padding: 12px;
            background: #2f2f2f;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .track-item:hover { 
            background: #3f3f3f; 
            border: 1px solid #ff0000;
        }
        .track-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 12px; color: #888888; margin-top: 4px; }
        
        /* Tu reproductor nativo de audio gris */
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca cualquier canción o artista...">
        <button id="btnBuscar" onclick="buscarMusicaMP3()">Buscar</button>
    </div>

    <div id="now-playing">Ninguna canción seleccionada</div>
    
    <div id="resultados"></div>

    <audio id="reproductor" controls></audio>
</div>

<script>
function buscarMusicaMP3() {
    const termino = document.getElementById('busqueda').value.trim();
    const contenedor = document.getElementById('resultados');
    const reproductor = document.getElementById('reproductor');
    const nowPlaying = document.getElementById('now-playing');
    
    if (!termino) return;
    
    contenedor.innerHTML = "";
    nowPlaying.innerText = "Toca el cuadro gris de abajo para activar la pista.";
    
    // Generamos la URL con la sintaxis de búsqueda exacta de archivos MP3
    const urlBusquedaAudio = "https://hearthis.at" + encodeURIComponent(termino);
    reproductor.src = urlBusquedaAudio;
    
    const item = document.createElement('div');
    item.className = 'track-item';
    item.innerHTML = `
        <div class="track-title" style="color: #ff0000;">▶ Escuchar: ${termino}</div>
        <div class="track-artist">Toca aquí para transmitir archivo MP3 directo</div>
    `;
    
    item.onclick = function() {
        nowPlaying.innerText = "Conectando stream de: " + termino;
        
        // Ejecutamos la carga física y la reproducción del flujo
        reproductor.load();
        reproductor.play().then(() => {
            nowPlaying.innerText = "Reproduciendo: " + termino;
        }).catch(error => {
            // Plan de respaldo si el navegador móvil exige activación manual de volumen
            nowPlaying.innerText = "Pista enlazada. Presiona PLAY en el reproductor blanco.";
        });
    };
    
    contenedor.appendChild(item);
}

document.getElementById('busqueda').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        buscarMusicaMP3();
    }
});
</script>

</body>
</html>
