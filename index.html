<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música Sin Anuncios</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { text-align: center; color: #1DB954; font-size: 24px; }
        .search-box { display: flex; margin-bottom: 20px; }
        input {
            flex: 1; padding: 12px; border: none;
            border-radius: 20px 0 0 20px; background-color: #282828;
            color: white; font-size: 16px; outline: none;
        }
        button {
            padding: 12px 20px; border: none;
            border-radius: 0 20px 20px 0; background-color: #1DB954;
            color: white; font-weight: bold; cursor: pointer;
        }
        #results { margin-bottom: 100px; }
        .song-item {
            display: flex; align-items: center; padding: 10px;
            margin-bottom: 10px; background-color: #181818;
            border-radius: 8px; cursor: pointer;
        }
        .song-item img {
            width: 50px; height: 50px; object-fit: cover;
            border-radius: 4px; margin-right: 15px;
        }
        .song-info { flex: 1; }
        .song-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
        .song-author { color: #b3b3b3; font-size: 12px; }
        
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: #282828; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }
        #current-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; text-align: center; }
        .controls { display: flex; gap: 20px; margin-top: 5px; }
        .btn-play {
            background: #1DB954; padding: 10px 20px; 
            border-radius: 20px; font-weight: bold; border: none; color: white;
        }
    </style>
</head>
<body>

    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="Busca una canción o artista...">
        <button id="search-btn">Buscar</button>
    </div>

    <div id="results"></div>

    <div class="player-bar">
        <div id="current-title">Ninguna canción seleccionada</div>
        <div class="controls">
            <button class="btn-play" id="btn-pause-play">Pausar</button>
        </div>
    </div>

    <script>
        const searchBtn = document.getElementById('search-btn');
        const queryInput = document.getElementById('query');
        const resultsDiv = document.getElementById('results');
        const currentTitle = document.getElementById('current-title');
        const pausePlayBtn = document.getElementById('btn-pause-play');

        const audio = new Audio();

        searchBtn.addEventListener('click', searchMusic);
        queryInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchMusic(); });

        pausePlayBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                pausePlayBtn.textContent = 'Pausar';
            } else {
                audio.pause();
                pausePlayBtn.textContent = 'Reproducir';
            }
        });

        async function searchMusic() {
            const query = queryInput.value.trim();
            if (!query) return;

            resultsDiv.innerHTML = '<p style="text-align:center;">Buscando música en vivo...</p>';

            try {
                // Conexión directa a la API de iTunes (Sin proxies, libre de CORS)
                const url = 'https://apple.com' + encodeURIComponent(query) + '&media=music&limit=10';
                const response = await fetch(url);
                const data = await response.json();
                const songs = data.results || [];

                resultsDiv.innerHTML = '';
                if (songs.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center;">No se encontraron resultados.</p>';
                    return;
                }

                songs.forEach((song) => {
                    const songItem = document.createElement('div');
                    songItem.className = 'song-item';
                    
                    // Reemplazamos la resolución para que la portada se vea mejor
                    const cover = song.artworkUrl100 || '';
                    
                    songItem.innerHTML = '<img src="' + cover + '" alt="Portada">' +
                        '<div class="song-info">' +
                            '<div class="song-title">' + song.trackName + '</div>' +
                            '<div class="song-author">' + song.artistName + '</div>' +
                        '</div>';
                    
                    songItem.addEventListener('click', () => {
                        currentTitle.textContent = 'Cargando: ' + song.trackName;
                        audio.src = song.previewUrl; // Enlace directo al archivo de audio (.m4a) sin anuncios
                        audio.play();
                        currentTitle.textContent = 'Reproduciendo: ' + song.trackName + ' - ' + song.artistName;
                        pausePlayBtn.textContent = 'Pausar';
                    });
                    
                    resultsDiv.appendChild(songItem);
                });
            } catch (error) {
                resultsDiv.innerHTML = '<p style="text-align:center;">Error al conectar con el catálogo. Intenta de nuevo.</p>';
            }
        }
    </script>
</body>
</html>
