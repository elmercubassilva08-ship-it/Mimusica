<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Música</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #161616;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
            text-align: center;
        }

        h1 {
            color: #ff2d55;
            font-size: 24px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 25px;
            padding: 12px 20px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        button {
            background-color: #ff2d55;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .status-container {
            min-height: 50px;
            margin-bottom: 10px;
        }

        .status-text {
            color: #8e8e93;
            font-size: 14px;
            margin: 5px 0;
        }

        .error-text {
            color: #ff453a;
            font-size: 14px;
            font-weight: 500;
            display: none;
            word-break: break-all;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            background-color: #ffffff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Mi Música</h1>

        <div class="search-box">
            <input type="text" id="inputBusqueda" placeholder="Mar de copas" value="Mar de copas">
            <button id="botonBuscar">Buscar</button>
        </div>

        <div class="status-container">
            <p id="textoEstado" class="status-text"></p>
            <p id="textoError" class="error-text"></p>
        </div>

        <!-- El reproductor de audio blanco inferior -->
        <audio id="reproductorAudio" controls></audio>
    </div>

    <script>
        const inputBusqueda = document.getElementById('inputBusqueda');
        const botonBuscar = document.getElementById('botonBuscar');
        const reproductorAudio = document.getElementById('reproductorAudio');
        const textoEstado = document.getElementById('textoEstado');
        const textoError = document.getElementById('textoError');

        botonBuscar.addEventListener('click', buscarMusicaReal);
        inputBusqueda.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscarMusicaReal();
        });

        function buscarMusicaReal() {
            const termino = inputBusqueda.value.trim();
            if (termino === "") return;

            // Limpiar la pantalla de errores previos
            textoError.style.display = 'none';
            textoError.textContent = '';
            textoEstado.textContent = "Buscando canción en servidores...";

            // REPARACIÓN COMPLETA DE LA URL: Añadida la ruta /advancedsearch.php?q=
            const urlAPI = `https://archive.org{encodeURIComponent(termino)}+AND+mediatype:audio&fl[]=identifier,title&output=json`;

            fetch(urlAPI)
                .then(response => {
                    if (!response.ok) throw new Error("Servidor ocupado o caído. Inténtalo más tarde.");
                    return response.json();
                })
                .then(data => {
                    // Validar si el servidor de Archive.org respondió con datos correctos
                    if (!data.response || !data.response.docs || data.response.docs.length === 0) {
                        throw new Error("No se encontraron resultados para esta búsqueda.");
                    }

                    const solicitudes = data.response.docs;
                    const itemValido = solicitudes[0]; // Tomamos el primer contenedor de música
                    const idContenedor = itemValido.identifier;
                    const tituloCancion = itemValido.title || termino;

                    textoEstado.textContent = `Conectando pista: ${tituloCancion}`;

                    // REPARACIÓN: Ruta correcta /metadata/ para obtener la lista de archivos mp3 del álbum
                    return fetch(`https://archive.org{idContenedor}`);
                })
                .then(response => {
                    if (!response) return;
                    return response.json();
                })
                .then(metaData => {
                    if (!metaData || !metaData.files) return;

                    // Filtrar los archivos que terminen en .mp3 para que el reproductor los entienda
                    const archivosMp3 = metaData.files.filter(f => f.name.toLowerCase().endsWith('.mp3'));

                    if (archivosMp3.length === 0) {
                        throw new Error("La canción encontrada no tiene un formato compatible (.mp3).");
                    }

                    // Tomamos la primera pista de audio encontrada
                    const nombreArchivo = archivosMp3[0].name;
                    
                    // REPARACIÓN: Ruta de descarga directa /download/
                    const urlStreamingDirecto = `https://archive.org{metaData.metadata.identifier}/${encodeURIComponent(nombreArchivo)}`;

                    // Inyectar el archivo de música real en la etiqueta audio
                    reproductorAudio.src = urlStreamingDirecto;
                    textoEstado.textContent = `Reproduciendo: ${metaData.metadata.title || "Audio En Línea"}`;
                    
                    // Reproducir pista automáticamente
                    reproductorAudio.play().catch(err => {
                        textoEstado.textContent = "Canción cargada. Presiona Play.";
                        console.log("El navegador bloqueó la reproducción automática. Se requiere interacción del usuario.");
                    });
                })
                .catch(error => {
                    console.error("Error del sistema:", error);
                    textoEstado.textContent = "Error de conexión.";
                    
                    if (error.message.includes('Failed to fetch')) {
                        mostrarError("Error en la red. Comprueba tu conexión a internet.");
                    } else {
                        mostrarError(error.message);
                    }
                });
        }

        function mostrarError(mensaje) {
            textoError.textContent = mensaje;
            textoError.style.display = 'block';
        }
    </script>
</body>
</html>
