<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Música Global</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1f1f1f;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 20px; color: #ff5500; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background-color: #ff5500;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #e04b00; }
        #resultados {
            text-align: left;
            margin-bottom: 25px;
            max-height: 280px;
            overflow-y: auto;
        }
        .track-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #2f2f2f;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .track-item:hover { background: #3f3f3f; }
        .track-img { width: 50px; height: 50px; border-radius: 6px; margin-right: 12px; object-fit: cover; }
        .track-info { flex: 1; overflow: hidden; }
        .track-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-author { font-size: 12px; color: #aaaaaa; }
        #player-container { width: 100%; margin-top: 15px; display: none; }
        iframe { border-radius: 12px; width: 100%; height: 120px; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Mi Música</h1>
    
    <div class="search-box">
        <input type="text" id="busqueda" placeholder="Busca canciones o artistas...">
        <button onclick="buscarMusica()">Buscar</button>
    </div>

    <div id="resultados"></div>

    <div id="player-container">
        <iframe id="reproductor" src=""></iframe>
    </div>
</div>

<script>
async function buscarMusica() {
    const termino = document.getElementById('busqueda').value;
    const contenedor = document.getElementById('resultados');
    if(!termino) return;
    
    contenedor.innerHTML = "<p style='color:#aaaaaa; text-align:center;'>Buscando canciones...</p>";

    try {
        // Conexión al buscador público de SoundCloud
        const url = "https://soundcloud.com" + encodeURIComponent(termino) + "&client_id=iZ0gOVC73SlmO993S4b4Ue7wXN4B6S1a&limit=5";
        
        // Usamos un catálogo alternativo directo para evitar errores de carga
        const tracksUrl = "https://soundcloud.com" + encodeURIComponent(termino) + "&client_id=2t9msScw7mMEm6j666MFr9gT6B7Z764N&limit=6";
        
        const respuesta = await fetch(tracksUrl);
        const canciones = await respuesta.json();
        
        contenedor.innerHTML = ""; 
        
        if (!canciones || canciones.length === 0) {
            contenedor.innerHTML = "<p style='color:#aaaaaa; text-align:center;'>No se encontraron resultados.</p>";
            return;
        }
        
        canciones.forEach(track => {
            const item = document.createElement('div');
            item.className = 'track-item';
            
            // Imagen de portada por defecto si no tiene
            const imagen = track.artwork_url ? track.artwork_url : 'https://picsum.photos';
            
            item.innerHTML = `
                <img class="track-img" src="${imagen}" alt="Portada">
                <div class="track-info">
                    <div class="track-title">${track.title}</div>
                    <div class="track-author">${track.user.username}</div>
                </div>
            `;
            
            // Al hacer clic, carga el reproductor oficial de SoundCloud limpio y sin anuncios
            item.onclick = () => {
                const playerContainer = document.getElementById('player-container');
                const iframe = document.getElementById('reproductor');
                
                iframe.src = "https://soundcloud.com" + encodeURIComponent(track.uri) + "&color=%23ff5500&auto_play=true&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false";
                playerContainer.style.display = "block";
                
                // Desplazar la pantalla suavemente hacia el reproductor
                playerContainer.scrollIntoView({ behavior: 'smooth' });
            };
            
            contenedor.appendChild(item);
        });
    } catch (error) {
        contenedor.innerHTML = "<p style='color:#ff4444; text-align:center;'>Error de conexión. Inténtalo de nuevo.</p>";
        console.error(error);
    }
}
</script>

</body>
</html>
